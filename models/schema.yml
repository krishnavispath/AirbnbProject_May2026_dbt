models:
  - name: dim_listings_cleansed
    description: "This table contains cleansed listing data for Airbnb listings."
    columns:
      - name: listing_id
        description: "Unique identifier for each listing."
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "Identifier for the host of each listing. References the dim_hosts_cleansed table."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "Type of room available for booking."
        data_tests:
          - accepted_values:
              values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: price
        description: "Price per night for the listing."
        data_tests:
          - positive_values